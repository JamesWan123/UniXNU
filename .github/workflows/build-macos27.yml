name: Build macOS 27 for Xiaomi Pad 6S Pro (sheng)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 清理雲端空間
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for app in /Applications/Xcode*.app; do
            if [ "$app" != "$ACTIVE_XCODE" ]; then sudo rm -rf "$app"; fi
          done
          sudo rm -rf ~/Library/Android /Library/Developer/CoreSimulator || true
          df -h

      - name: 下載 UniXNU 及 sheng 專屬驅動庫
        run: |
          rm -rf workspace
          mkdir -p workspace && cd workspace
          git clone --recurse-submodules https://github.com/UniXNU/UniXNU
          git clone --recurse-submodules https://github.com/UniXNU/UniXNU-sheng
          git clone --recurse-submodules https://github.com/UniXNU/uefi-sheng

      - name: 安裝 Mac 編譯工具鏈
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install python@3.12 llvm lld dtc mtools cmake ninja meson rsync uv zstd p7zip || true

      - name: 拉取 macOS 27 IPSW 與小米底層韌體
        working-directory: workspace/UniXNU
        run: |
          sed 's/<device>/sheng/g' unixnu.example.toml > unixnu.local.toml
          ./unixnu defconfig sheng_ipados26_defconfig -D ../UniXNU-sheng --os macos-27
          ./unixnu fetch --os macos-27
          ./unixnu ipsw fetch --os macos-27
          ./unixnu tree --os macos-27
          find out/ -name "*.ipsw" -delete || true

      - name: 編譯 XNU 核心、UEFI 及生成 Data 種子
        working-directory: workspace/UniXNU
        run: |
          ./unixnu build kernel --os macos-27
          ./unixnu build package --os macos-27
          ./unixnu build firmware --uefi ../uefi-sheng --os macos-27
          if ! ./unixnu build payload --os macos-27 --skip-setup 2>&1 | tee payload.log; then
            SEED_CMD=$(grep -o "sudo python3 .*make-macos-data-seed\.py.*" payload.log | head -n 1)
            if [ -n "$SEED_CMD" ]; then eval "$SEED_CMD"; fi
            ./unixnu build payload --os macos-27 --skip-setup
          fi
          ./unixnu build userdata --os macos-27
          ./unixnu bootimg --os macos-27

      - name: 壓縮開機檔與系統鏡像
        working-directory: workspace/UniXNU
        run: |
          mkdir -p ../upload
          find out/ -name "boot.img" -exec cp {} ../upload/ \;
          find out/ -name "userdata-root.img" -exec 7z a -v1900m -mx=1 ../upload/userdata-root.7z {} \;

      - name: 上傳成品供 Windows 下載
        uses: actions/upload-artifact@v4
        with:
          name: macos27-sheng-images
          path: workspace/upload/*
          retention-days: 3
